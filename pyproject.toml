[tool.poetry]
# ToDo - Update the name to match the new repository name, e.g. 'ies-building'
name = "ies-[domain]"
version = "0.0.0"
# ToDo - Update the description to match the new repository name, e.g. 'IES building domain ontology'
description = "IES [domain] ontology"
# ToDo - Update the authors
authors = ["aigora-de <23141680+aigora-de@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "ies_tools"}]
# ToDo - Update the repository URL to refer to the new repository name, e.g. 'https://github.com/IES-Org/ies-building'
repository = "https://github.com/IES-Org/ies-ontology-template"

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.3"
rdflib = "^7.1.3"
pyshacl = "^0.30.0"
setuptools = "^68.0.0"
wheel = "^0.40.0"

[tool.poetry.scripts]
ies-build = "ies_tools.src.build.build:cli"
gh-tools = "ies_tools.src.github_tools.github:cli"
domain-range-checker = "ies_tools.src.domain_range_checker.data_domain_range_use:main"
kpi-runner = "ies_tools.src.kpi_runner.ontology_kpi_test_runner:main"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0.1"
mypy = "^1.13.0"
types-pyyaml = "^6.0.12.20240917"
types-redis = "^4.6.0.20241004"
types-requests = "^2.32.0.20241016"
black = "^24.10.0"
isort = "^5.13.2"
pylint = "^2.17.3"
pytest-flask = "^1.3.0"
pytest = "^8.3.3"

[tool.isort]
profile = "black"
line_length = 80

[tool.black]
line-length = 80

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
