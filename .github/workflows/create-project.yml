name: Create Organization Project

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Name of the project'
        required: true
        type: string
      project_description:
        description: 'Project description'
        required: false
        type: string
        default: ''
      repository_name:
        description: 'Repository to link (format: org/repo)'
        required: true
        type: string

jobs:
  create-project:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create and link project
        env:
          GH_TOKEN: ${{ secrets.IES_ONTOLOGIES_PAT }}
          ORG_NAME: ${{ github.repository_owner }}
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_DESCRIPTION: ${{ inputs.project_description }}
          REPO_NAME: ${{ inputs.repository_name }}
        run: |
          # First, get organization and repository IDs using GraphQL
          org_and_repo_json=$(gh api graphql -f query='
            query($org: String!, $repo_owner: String!, $repo_name: String!) {
              organization(login: $org) {
                id
              }
              repository(owner: $repo_owner, name: $repo_name) {
                id
              }
            }' \
            -f org="$ORG_NAME" \
            -f repo_owner="$(echo $REPO_NAME | cut -d'/' -f1)" \
            -f repo_name="$(echo $REPO_NAME | cut -d'/' -f2)")
          
          org_id=$(echo "$org_and_repo_json" | jq -r '.data.organization.id')
          repo_id=$(echo "$org_and_repo_json" | jq -r '.data.repository.id')
          echo "Organization ID: $org_id"
          echo "Repository ID: $repo_id"

          # Create project using GraphQL API
          project_json=$(gh api graphql -f query='
            mutation($orgId: ID!, $name: String!, $repoId: ID!) {
              createProjectV2(
                input: {
                  ownerId: $orgId,
                  title: $name,
                  repositoryId: $repoId
                }
              ) {
                projectV2 {
                  id
                  number
                }
              }
            }' \
            -f orgId="$org_id" \
            -f name="$PROJECT_NAME" \
            -f repoId="$repo_id")
          
          # Extract and output project ID and number
          project_id=$(echo "$project_json" | jq -r '.data.createProjectV2.projectV2.id')
          project_number=$(echo "$project_json" | jq -r '.data.createProjectV2.projectV2.number')
          
          echo "Project created and linked successfully!"
          echo "Project ID: $project_id"
          echo "Project Number: $project_number"
          echo "Project URL: https://github.com/orgs/$ORG_NAME/projects/$project_number"
